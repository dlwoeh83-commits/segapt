<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>게시판 | 세교1구역주택재개발정비사업조합</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23f26a1b'/%3E%3Ctext x='32' y='44' font-size='34' font-weight='800' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3E1%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=27">
</head>
<body class="join-page">
  <header class="site-header">
    <span id="utilLinks" hidden></span>
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <span class="logo-mark" aria-hidden="true"><b>세교</b><i>1</i><b>구역</b></span>
        <span class="logo-text"><strong>세교1구역</strong><small>주택재개발정비사업조합</small></span>
      </a>
      <button class="nav-toggle" aria-label="메뉴 열기" aria-expanded="false"><span></span><span></span><span></span></button>
      <nav class="site-nav" aria-label="주요 메뉴"></nav>
    </div>
  </header>

  <main class="join-main">
    <div class="container narrow-board">
      <div class="section-head" style="margin-bottom:28px">
        <p class="eyebrow">BOARD</p>
        <h2>게시판</h2>
      </div>

      <p class="setup-warn" id="setupWarn" hidden>Supabase 설정 전입니다. <code>config.js</code>에 주소와 키를 넣고 <code>supabase/schema.sql</code>을 실행해 주세요.</p>

      <!-- 로그인 -->
      <section class="auth-card" id="authBox" hidden>
        <h3>로그인</h3>
        <form id="loginForm" class="auth-form">
          <label>아이디<input type="text" name="userid" autocomplete="username" required></label>
          <label>비밀번호<input type="password" name="password" autocomplete="current-password" required></label>
          <button class="btn btn-primary btn-block" type="submit">로그인</button>
          <p class="form-msg" id="loginMsg" role="status" aria-live="polite"></p>
          <p class="join-note">아직 회원이 아니신가요? <a href="join.html"><b>회원가입 신청</b></a></p>
        </form>
      </section>

      <!-- 게시판 본문 -->
      <section id="boardBox" hidden>
        <div class="who" id="who"></div>
        <div class="b-tabs" role="tablist">
          <button class="b-tab active" data-board="notice" role="tab">공지사항</button>
          <button class="b-tab" data-board="data" role="tab">공개자료</button>
          <button class="b-tab" data-board="free" role="tab">조합마당</button>
        </div>
        <div class="b-bar">
          <span id="count"></span>
          <button class="btn btn-primary" id="writeBtn" type="button">글쓰기</button>
        </div>

        <form class="write" id="writeForm" hidden>
          <label>제목<input type="text" name="title" maxlength="120" required></label>
          <label>내용<textarea name="content" rows="7" maxlength="5000" required></textarea></label>
          <div class="write-actions">
            <button type="button" class="btn btn-navy" id="cancelBtn">취소</button>
            <button type="submit" class="btn btn-primary">등록</button>
          </div>
          <p class="form-msg" id="writeMsg" role="status" aria-live="polite"></p>
        </form>

        <ul class="post-list" id="postList"></ul>
        <p class="empty" id="empty" hidden>등록된 글이 없습니다.</p>
        <div class="pager" id="pager"></div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="foot-top"><strong>세교1구역주택재개발정비사업조합</strong><span>경기도 평택시 평택로 180, 202호 (세교동 한영빌딩) · Tel 031-618-4510~1</span></div>
      <p class="copy">© 세교1구역주택재개발정비사업조합. All rights reserved.</p>
    </div>
  </footer>

  <script src="common.js?v=5"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js?v=2"></script>
  <script src="attach.js?v=1"></script>
  <script src="board.js?v=7"></script>
</body>
</html>
