<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>비밀번호 변경 | 세교1구역주택재개발정비사업조합</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23f26a1b'/%3E%3Ctext x='32' y='44' font-size='34' font-weight='800' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3E1%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=27">
</head>
<body class="join-page">
  <header class="site-header">
    <span id="utilLinks" hidden></span>
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <span class="logo-mark" aria-hidden="true"><b>세교</b><i>1</i><b>구역</b></span>
        <span class="logo-text"><strong>세교1구역</strong><small>주택재개발정비사업조합</small></span>
      </a>
      <button class="nav-toggle" aria-label="메뉴 열기" aria-expanded="false"><span></span><span></span><span></span></button>
      <nav class="site-nav" aria-label="주요 메뉴"></nav>
    </div>
  </header>

  <main class="join-main">
    <div class="container narrow-board">
      <div class="section-head" style="margin-bottom:28px">
        <p class="eyebrow">MY ACCOUNT</p>
        <h2>비밀번호 변경</h2>
      </div>

      <p class="setup-warn" id="setupWarn" hidden>Supabase 설정 전입니다.</p>

      <section class="auth-card" id="needLogin" hidden>
        <h3>로그인이 필요합니다</h3>
        <p class="gate-msg">로그인한 뒤 비밀번호를 변경할 수 있습니다.</p>
        <a class="btn btn-primary btn-block" href="board.html">로그인</a>
      </section>

      <section class="auth-card" id="pwBox" hidden>
        <p class="who ok" id="whoAmI" style="margin-bottom:16px"></p>
        <form class="auth-form" id="pwForm" novalidate>
          <label>현재 비밀번호<input type="password" name="current" autocomplete="current-password" required></label>
          <label>새 비밀번호 <small>(8자 이상, 영문과 숫자를 섞어 주세요)</small><input type="password" name="next" autocomplete="new-password" minlength="8" required></label>
          <label>새 비밀번호 확인<input type="password" name="next2" autocomplete="new-password" required></label>
          <button class="btn btn-primary btn-block" type="submit">비밀번호 변경</button>
          <p class="form-msg" id="pwMsg" role="status" aria-live="polite"></p>
          <p class="join-note">비밀번호는 암호화되어 저장되며, 관리자도 볼 수 없습니다. 다른 사이트에서 쓰는 비밀번호와 같게 하지 마세요.</p>
        </form>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="foot-top"><strong>세교1구역주택재개발정비사업조합</strong><span>경기도 평택시 평택로 180, 202호 (세교동 한영빌딩) · Tel 031-618-4510~1</span></div>
      <p class="copy">© 세교1구역주택재개발정비사업조합. All rights reserved.</p>
    </div>
  </footer>

  <script src="common.js?v=5"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js?v=2"></script>
  <script src="account.js?v=1"></script>
</body>
</html>
